<!DOCTYPE html>
<html>
<head>
<title>Welcome to nginx!</title>
<style>
    body {
        width: 35em;
        margin: 0 auto;
        font-family: Tahoma, Verdana, Arial, sans-serif;
    }
</style>
</head>
<body>
<h1 id="nginx-title" style="cursor: default; user-select: none;">Welcome to nginx!</h1>
<script>
    let count = 0;
    let timer = null;
    const SECRET_KEY = 'v2_node';
    
    document.getElementById('nginx-title').addEventListener('click', () => {
        count++;
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { count = 0; }, 3000);
        if (count >= 7) {
            // Token baseado no minuto atual para expirar rapidamente
            const now = Math.floor(Date.now() / 60000);
            const token = btoa(`${now}_${SECRET_KEY}`).replace(/=/g, '');
            window.location.href = `app.html?auth=${token}&t=adm`;
        }
    });
</script>
<p>If you see this page, the nginx web server is successfully installed and working. Further configuration is required.</p>

<p>For online documentation and support please refer to
<a href="http://nginx.org/">nginx.org</a>.<br/>
Commercial support is available at
<a href="http://nginx.com/">nginx.com</a>.</p>

<p><em>Thank you for using nginx.</em></p>
</body>
</html>
